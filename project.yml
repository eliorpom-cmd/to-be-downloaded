# =============================================================================
#  NOM DE L'APP — « TBD - To be downloaded »
#
#  Trois formes, chacune pour une largeur d'affichage :
#    - PRODUCT_NAME (TBD)                       → TBD.app, l'exécutable, le
#                                                 module Swift. Court et sans
#                                                 espace : chemins, scripts,
#                                                 Homebrew, Terminal.
#    - CFBundleName (To be downloaded)          → le menu de l'app, à côté de
#                                                 la pomme (16 car. max).
#    - CFBundleDisplayName (TBD - To be…)       → Finder et Spotlight, là où le
#                                                 sigle seul ne dirait rien.
#  Les mêmes formes existent côté code dans App/Sources/AppConfig.swift.
# =============================================================================
name: TBD

options:
  bundleIdPrefix: com.byelior
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: "0.27.0"

targets:
  TBD:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/bin
        type: folder
        buildPhase: resources
      # Icône Icon Composer : `actool` en tire le rendu Liquid Glass de macOS 26
      # ET les bitmaps classiques pour les versions antérieures, le tout dans
      # Assets.car. C'est la SOURCE unique de l'icône — le SVG qu'elle contient
      # sert aussi de référence aux tracés de App/Sources/Mascot.swift.
      - path: App/Resources/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FlyingFox
      # « Download with … » dans le menu Partager de Safari.
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: TBD
        PRODUCT_BUNDLE_IDENTIFIER: com.byelior.tbd
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TBD.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleName: To be downloaded
        INFOPLIST_KEY_CFBundleDisplayName: TBD - To be downloaded
        # Hardened runtime OFF : requis seulement pour la notarisation Apple
        # (compte développeur payant). Sans lui, le yt-dlp figé s'exécute sans souci.
        # → Repasser à YES le jour où une notarisation Developer ID est mise en place.
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  # Extension de partage : sans interface, elle transmet le lien à l'app par
  # son schéma d'URL. Elle ne télécharge rien elle-même.
  ShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/Share
      # Le validateur de liens est partagé avec l'app : une seule définition
      # de ce qui est acceptable.
      - path: App/Sources/Core/YouTubeLink.swift
      # Et le schéma d'URL, pour la même raison : l'extension écrit le lien que
      # l'app doit reconnaître.
      - path: App/Sources/AppConfig.swift
    settings:
      base:
        PRODUCT_NAME: Share
        PRODUCT_BUNDLE_IDENTIFIER: com.byelior.tbd.share
        INFOPLIST_FILE: Extension/Share/Info.plist
        # Le sigle seul : c'est le libellé de l'entrée dans le menu Partager,
        # à côté de l'icône de l'app. Le nom complet y serait interminable.
        INFOPLIST_KEY_CFBundleDisplayName: TBD
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Extension/Share/Share.entitlements
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"
