# =============================================================================
#  NOM DE L'APP — PLACEHOLDER
#  Pour renommer l'app plus tard, change ces 3 valeurs puis relance `xcodegen`:
#    - name: (nom du projet)
#    - PRODUCT_NAME
#    - INFOPLIST_KEY_CFBundleDisplayName
#  Le nom affiché dans le code vit dans App/Sources/AppConfig.swift.
# =============================================================================
name: Downloader

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: "0.27.0"

targets:
  Downloader:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/bin
        type: folder
        buildPhase: resources
      # Icône générée par ./scripts/make-icon.sh à partir du tracé du logo.
      - path: App/Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: FlyingFox
      # « Download with … » dans le menu Partager de Safari.
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: Downloader
        PRODUCT_BUNDLE_IDENTIFIER: com.local.downloader
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Downloader.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Downloader
        # Hardened runtime OFF : requis seulement pour la notarisation Apple
        # (compte développeur payant). Sans lui, le yt-dlp figé s'exécute sans souci.
        # → Repasser à YES le jour où une notarisation Developer ID est mise en place.
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  # Extension de partage : sans interface, elle transmet le lien à l'app par
  # son schéma d'URL. Elle ne télécharge rien elle-même.
  ShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/Share
      # Le validateur de liens est partagé avec l'app : une seule définition
      # de ce qui est acceptable.
      - path: App/Sources/Core/YouTubeLink.swift
    settings:
      base:
        PRODUCT_NAME: Share
        PRODUCT_BUNDLE_IDENTIFIER: com.local.downloader.share
        INFOPLIST_FILE: Extension/Share/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Downloader
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Extension/Share/Share.entitlements
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"
