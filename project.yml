# =============================================================================
#  APP NAME — "TBD - To be downloaded"
#
#  Three forms, each for a display width:
#    - PRODUCT_NAME (TBD)                       → TBD.app, the executable,
#                                                 the Swift module. Short and no
#                                                 spaces: paths, scripts,
#                                                 Homebrew, Terminal.
#    - CFBundleName (To be downloaded)          → the app menu, next to the
#                                                 Apple logo (16 char max).
#    - CFBundleDisplayName (TBD - To be…)       → Finder and Spotlight, where
#                                                 the acronym alone says nothing.
#  The same forms exist in code in App/Sources/AppConfig.swift.
# =============================================================================
name: TBD

options:
  bundleIdPrefix: com.byelior
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202608081924"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: "0.27.0"

targets:
  TBD:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/bin
        type: folder
        buildPhase: resources
      # Icon Composer icon: `actool` extracts the Liquid Glass rendering for
      # macOS 26 AND the classic bitmaps for older versions, all in Assets.car.
      # This is the SINGLE SOURCE of the icon — the SVG it contains also serves
      # as reference for the paths in App/Sources/Mascot.swift.
      - path: App/Resources/AppIcon.icon
        buildPhase: resources
      # Brand logos (GitHub, Instagram) for the "About" section of settings:
      # the system font has no brand SF Symbol. Delivered as SVG, which `NSImage`
      # can read since macOS 13 — one file per logo instead of a set of bitmaps
      # @1x/@2x/@3x.
      - path: App/Resources/Logos
        type: folder
        buildPhase: resources
    dependencies:
      - package: FlyingFox
      # "Download with …" in Safari's Share menu.
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: TBD
        PRODUCT_BUNDLE_IDENTIFIER: com.byelior.tbd
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TBD.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleName: To be downloaded
        INFOPLIST_KEY_CFBundleDisplayName: TBD - To be downloaded
        # Hardened runtime OFF: required only for Apple notarization (paid
        # developer account). Without it, the frozen yt-dlp runs fine.
        # → Switch to YES when Developer ID notarization is set up.
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        # CONTRIBUTING promises "no warnings", so the build enforces it rather
        # than trusting anyone to read the log. Set on the TARGET and not on the
        # project or the xcodebuild command line: those reach the SwiftPM
        # dependencies too, which compile with -suppress-warnings, and the two
        # flags together are a hard compiler error.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  # Share extension: no interface, it passes the link to the app via its URL
  # scheme. It does not download anything itself.
  ShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/Share
      # Link validator shared with the app: single definition of what is
      # acceptable.
      - path: App/Sources/Core/YouTubeLink.swift
      # And the URL scheme, for the same reason: the extension writes the link
      # that the app must recognize.
      - path: App/Sources/AppConfig.swift
    settings:
      base:
        PRODUCT_NAME: Share
        PRODUCT_BUNDLE_IDENTIFIER: com.byelior.tbd.share
        INFOPLIST_FILE: Extension/Share/Info.plist
        # The acronym alone: it is the label of the entry in the Share menu,
        # next to the app icon. The full name would be unwieldy there.
        INFOPLIST_KEY_CFBundleDisplayName: TBD
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Extension/Share/Share.entitlements
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"
